name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: core
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test ./...

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build cmake clang pkg-config
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  version:
    name: Check the tag
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compare the tag with pubspec.yaml
        run: |
          version=$(sed -n 's/^version: \([^+]*\).*/\1/p' app/pubspec.yaml | head -n1)
          tag="${GITHUB_REF_NAME#v}"
          echo "tag=$tag pubspec=$version"
          if [ "$version" != "$tag" ]; then
            echo "::error::The tag v$tag does not match the version $version in app/pubspec.yaml"
            exit 1
          fi

  release:
    name: Release (${{ matrix.artifact }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, app, version]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: windows-x64
          - os: macos-15-intel
            artifact: macos-x64
          - os: macos-15
            artifact: macos-arm64
          - os: ubuntu-latest
            artifact: linux-x64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.6'
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build cmake clang pkg-config
      - name: Install Inno Setup
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install innosetup --no-progress -y
      - name: Build (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME -replace '^v',''
          ./scripts/build-windows.ps1 -Version $version
      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: ./scripts/build-macos.sh "${GITHUB_REF_NAME#v}"
      - name: Build (Linux)
        if: runner.os == 'Linux'
        run: ./scripts/build-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Archive (macOS)
        if: runner.os == 'macOS'
        run: |
          cd dist/macos
          zip -qry "../y-node-desktop-${GITHUB_REF_NAME#v}-${{ matrix.artifact }}.zip" Y-Node.app
      - uses: actions/upload-artifact@v4
        with:
          name: y-node-desktop-${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.exe
            dist/*.tar.gz
            dist/*.pkg
            dist/*.deb
          if-no-files-found: error

  checksums:
    name: Checksums
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Build SHA256SUMS.txt
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          cd release
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: checksums
          path: release/SHA256SUMS.txt
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [release, checksums]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Collect the release files
        run: |
          mkdir -p release
          find artifacts -type f -exec cp {} release/ \;
          ls -l release
      - name: Read the changelog section
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v ver="$version" '
            $0 ~ "^## " ver "([[:space:]]|$)" { found = 1; next }
            found && /^## / { exit }
            found { print }
          ' CHANGELOG.md | sed '/./,$!d' > release-notes.md
          if [ ! -s release-notes.md ]; then
            echo "Y-Node Desktop $version" > release-notes.md
          fi
          cat release-notes.md
      - uses: softprops/action-gh-release@v2
        with:
          name: Y-Node Desktop ${{ github.ref_name }}
          body_path: release-notes.md
          files: release/*
          fail_on_unmatched_files: true
