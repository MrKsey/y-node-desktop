name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  core:
    name: Core (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        working-directory: core
        run: test -z "$(gofmt -l .)"
      - name: Vet
        working-directory: core
        run: go vet ./...
      - name: Test
        working-directory: core
        run: go test ./...

  app:
    name: App (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build cmake clang pkg-config
      - name: Resolve dependencies
        working-directory: app
        run: flutter pub get
      - name: Analyze
        working-directory: app
        run: flutter analyze
      - name: Test
        working-directory: app
        run: flutter test

  release:
    name: Release (${{ matrix.os }})
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [core, app]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26'
          cache-dependency-path: core/go.sum
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
      - name: Install Linux build dependencies
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev ninja-build cmake clang pkg-config
      - name: Build (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: ./scripts/build-windows.ps1 -Version ${{ github.ref_name }} -SkipMsix
      - name: Build (macOS)
        if: matrix.os == 'macos-latest'
        run: ./scripts/build-macos.sh "${GITHUB_REF_NAME#v}"
      - name: Build (Linux)
        if: matrix.os == 'ubuntu-latest'
        run: ./scripts/build-linux.sh "${GITHUB_REF_NAME#v}"
      - name: Archive (Windows)
        if: matrix.os == 'windows-latest'
        shell: pwsh
        run: Compress-Archive -Path dist/windows/* -DestinationPath "dist/y-node-desktop-${env:GITHUB_REF_NAME}-windows-x64.zip"
      - name: Archive (macOS)
        if: matrix.os == 'macos-latest'
        run: |
          cd dist/macos
          zip -qry "../../y-node-desktop-${GITHUB_REF_NAME}-macos.zip" Y-Node.app
      - uses: actions/upload-artifact@v4
        with:
          name: y-node-desktop-${{ matrix.os }}
          path: |
            dist/*.zip
            dist/*.tar.gz
          if-no-files-found: error

  publish:
    name: Publish the release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
